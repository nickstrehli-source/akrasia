name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: akrasia
          POSTGRES_PASSWORD: akrasia
          POSTGRES_DB: akrasia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U akrasia -d akrasia_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://akrasia:akrasia@localhost:5432/akrasia_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Migrate up (test DB for Postgres-backed unit tests)
        run: npm run db:migrate:up

      - name: Test
        run: npm test

  db:
    name: migrations / seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: akrasia
          POSTGRES_PASSWORD: akrasia
          POSTGRES_DB: akrasia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U akrasia -d akrasia_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://akrasia:akrasia@localhost:5432/akrasia_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Migrate up
        run: npm run db:migrate:up

      - name: Seed demo dataset
        run: npm run db:seed

      - name: Agent substrate smoke test (Postgres-backed)
        run: npx vitest run src/agents/runtime.pg.test.ts

      - name: Prove reversibility (down + up)
        run: |
          npm run db:migrate:down
          npm run db:migrate:up
          npm run db:seed
